<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6fbf8"><meta name="description" content="Nihongo Pro – học tiếng Nhật JLPT N3 đến N1 bằng tiếng Việt.">
  <title>Nihongo Pro – N3 đến N1</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home"><span class="brand-mark">日</span><span><b>Nihongo Pro</b><small>日本語を学ぼう</small></span></a>
      <div class="level-switch"><label for="level">LỘ TRÌNH CỦA BẠN</label><select id="level"><option>N3</option><option>N2</option><option>N1</option></select></div>
      <nav class="nav-list" aria-label="Điều hướng">
        <button class="nav-btn active" data-page="home">🏠 <span>Tổng quan</span></button>
        <button class="nav-btn" data-page="learn">📚 <span>Bài học</span></button>
        <button class="nav-btn" data-page="vocab">🧠 <span>Từ vựng & Kanji</span></button>
        <button class="nav-btn" data-page="grammar">✍️ <span>Ngữ pháp</span></button>
        <button class="nav-btn" data-page="listening">🎧 <span>Luyện nghe</span></button>
        <button class="nav-btn" data-page="reading">📖 <span>Đọc hiểu</span></button>
        <button class="nav-btn" data-page="quiz">🏆 <span>Luyện đề JLPT</span></button>
      </nav>
      <div class="sidebar-note"><span>🌱</span><b>Mỗi ngày tiến một chút</b><p>30 phút đều đặn sẽ tạo nên khác biệt.</p></div>
      <div class="sidebar-foot">Học tiếng Nhật cùng Nihongo Pro</div>
    </aside>
    <main class="main-content">
      <header class="topbar"><button class="mobile-brand" id="menuToggle">☰ Nihongo Pro</button><div class="top-spacer"></div><div class="streak">🔥 <b id="streak">1</b> ngày</div><div class="xp">⭐ <b id="xp">0</b> XP</div><div class="avatar">学</div></header>
      <section id="app" aria-live="polite"></section>
      <footer>日本語の勉強を楽しもう！ <span>·</span> Nihongo Pro</footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
